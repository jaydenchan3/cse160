  <p>Jayden Chan &nbsp; jatychan@ucsc.edu</p>

  <canvas id="webgl" width="400" height="400" style="display:block"></canvas>

  <br>
  <img src="my_sketch.jpg" alt="Reference Sketch" width="300">

  <br>
  <button onclick="clearCanvas()">Clear Canvas</button>
  <button onclick="drawPicture()">Draw Picture</button>

  <br><br>
  Drawing Mode:<br>
  <button onclick="g_selectedType='point'">Squares</button>
  <button onclick="g_selectedType='triangle'">Triangles</button>
  <button onclick="g_selectedType='circle'">Circles</button>

  <br><br>
  Shape Color:<br>
  Red   <input type="range" id="redSlider"   min="0" max="255" value="255">
  Green <input type="range" id="greenSlider" min="0" max="255" value="255">
  Blue  <input type="range" id="blueSlider"  min="0" max="255" value="0">

  <br>
  Shape Size: <input type="range" id="sizeSlider" min="1" max="100" value="10">
  &nbsp;&nbsp;
  (Circles) Segment Count: <input type="range" id="segmentSlider" min="3" max="50" value="10">

  <script src="lib/cuon-utils.js"></script>
  <script src="Point.js"></script>
  <script src="Triangle.js"></script>
  <script src="Circle.js"></script>
  <script src="Picture.js"></script>
